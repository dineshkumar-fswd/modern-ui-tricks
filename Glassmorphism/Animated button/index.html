<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Animated Buttons</title>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <button class="glass">Glass Button</button>
      </div>

      <div class="card">
        <button class="gradient">Gradient Glow</button>
      </div>

      <div class="card">
        <button class="liquid">
          <span>Liquid Fill</span>
        </button>
      </div>

      <div class="card">
        <button class="shimmer">Shimmer</button>
      </div>

      <div class="card">
        <button class="neon">Neon Border</button>
      </div>
    </div>
  </body>
</html>
